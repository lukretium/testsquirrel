<!doctype html>
<!--
  Compositing stage for the demo screencast: the fake app fills the frame and
  the mascot "webcam" sits picture-in-picture in the bottom-left corner, the
  same way the TestWeasel demo is shot.

  seek(t) fans out to both iframes so the whole 1920x1080 frame is a pure
  function of t and can be stepped by build/render-demo.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0b0d0c}
  iframe{border:0;display:block}
  #app{position:absolute;inset:0;width:1920px;height:1080px}
  #cam{
    position:absolute;left:40px;bottom:40px;width:480px;height:270px;
    border-radius:16px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 3px #0e9e86, 0 0 0 6px rgba(14,158,134,.25);
  }
  #cam iframe{width:640px;height:360px;transform:scale(.75);transform-origin:0 0}
  /* recording chrome: a small live badge on the webcam tile */
  #live{
    position:absolute;left:56px;bottom:282px;display:flex;align-items:center;gap:7px;
    padding:5px 11px;border-radius:999px;background:rgba(10,14,13,.78);
    font:700 13px/1 "Segoe UI",system-ui,sans-serif;color:#fff;letter-spacing:.06em;
  }
  #live b{display:block;width:9px;height:9px;border-radius:50%;background:#ef4444}
</style>
</head>
<body>
  <iframe id="app" src="app.html" scrolling="no"></iframe>
  <div id="cam"><iframe id="camFrame" src="pip.html" scrolling="no"></iframe></div>
  <div id="live"><b></b>LIVE</div>
<script>
(() => {
  const app = document.getElementById('app');
  const cam = document.getElementById('camFrame');
  const live = document.getElementById('live');

  window.DURATION = 42;
  window.ready = () =>
    !!(app.contentWindow && app.contentWindow.seek && cam.contentWindow && cam.contentWindow.seek);

  window.seek = function seek(t) {
    if (app.contentWindow && app.contentWindow.seek) app.contentWindow.seek(t);
    if (cam.contentWindow && cam.contentWindow.seek) cam.contentWindow.seek(t);
    // REC dot pulses on a 1s cycle
    live.querySelector('b').style.opacity = (0.45 + 0.55 * Math.abs(Math.sin(t * Math.PI))).toFixed(3);
  };
})();
</script>
</body>
</html>
